<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 28">
  <!-- 기본 프로필: 트릭컬식으로 한쪽 볼따구만 빵빵하게 튀어나온 얼굴 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a0808f"/>
      <stop offset="1" stop-color="#7a5d6c"/>
    </linearGradient>
  </defs>
  <g fill="url(#g)">
    <ellipse cx="13.6" cy="13.6" rx="10.6" ry="11.4"/>
    <ellipse cx="14.6" cy="21.2" rx="10.6" ry="6.2"/>
    <!-- 튀어나온 볼 -->
    <circle cx="24.6" cy="19.4" r="8.2"/>
  </g>
  <!-- 볼 하이라이트 -->
  <ellipse cx="26.4" cy="15.8" rx="3.4" ry="2.2" fill="#fff" opacity=".14"/>
  <!-- 눈 -->
  <circle cx="9.8" cy="14" r="1.45" fill="#2b2226"/>
  <circle cx="16.6" cy="14" r="1.45" fill="#2b2226"/>
  <!-- 홍조: 튀어나온 볼은 진하게 -->
  <ellipse cx="25.6" cy="20.6" rx="3.6" ry="2" fill="#ff8fbf" opacity=".7"/>
  <ellipse cx="6" cy="19" rx="2" ry="1.2" fill="#ff8fbf" opacity=".45"/>
  <!-- 입: 볼 쪽으로 살짝 밀린 ω -->
  <path d="M11.6 17.8c.4.9 1.2.9 1.6 0 .4.9 1.2.9 1.6 0" fill="none" stroke="#2b2226" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
